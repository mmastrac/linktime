name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        uses: "mmastrac/mmm-matrix@v1"
        with:
          input: |
            project: [ctor]
            needs:
              $match:
                "this.job == 'wasm'": "wasmtime-cli"
                "this.job == 'test'": "cargo-expand"
                "this.job == 'zigbuild'": "cargo-zigbuild"
            rust-toolchain:
              $match:
                "this.job == 'miri'": nightly
                "this.job == 'lint'": [stable, nightly]
                "this.job == 'test-used-linker'": nightly
                "this.job == 'build'": [stable, beta, nightly]
                "this.job == 'build-minimal'": ["1.65"]
                "this.job == 'wasm'": ["1.85"]
                "true": "stable"
            rust-extra-target:
              $match:
                "this.job == 'wasm'": "wasm32-unknown-unknown,wasm32-wasip1,wasm32-wasip2"
                "this.label == 'linux-musl'": "x86_64-unknown-linux-musl"
            rust-components:
              $match:
                "this.job == 'miri'": "miri,rust-src"
                "this.job == 'lint'": "clippy,rustfmt"
                "this.job == 'test-used-linker'": rust-src
            label:
              linux:
                os:
                  ubuntu-latest:
                    job: [test, test-used-linker, miri, wasm]
                    target: x86_64-unknown-linux-gnu
                  ubuntu-slim:
                    job: [build, build-minimal, lint, sanitize]
                    target: x86_64-unknown-linux-gnu
              linux-musl:
                os: ubuntu-latest
                job: [build, lint, test]
                target: x86_64-unknown-linux-musl
              macos:
                os: macOS-latest
                job: [lint, test, test-used-linker, miri, zigbuild, sanitize]
                target: aarch64-apple-darwin
              windows:
                os: windows-latest
                job: [lint, test, miri]
                target: x86_64-pc-windows-msvc
          config: |
            github: ${{ toJSON(github) }}

  build:
    name: ${{ matrix.label }} / ${{ matrix.job }} (${{ matrix.rust-toolchain }})
    runs-on: ${{ matrix.os }}
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    env:
      CACHE_KEY: 2

    steps:
    - uses: actions/checkout@v6

    - name: Install required Rust tools
      uses: taiki-e/install-action@v2
      if: ${{ matrix.needs }}
      with:
        tool: ${{ matrix.needs }}
  
    - name: Install Rust toolchain (${{ matrix.rust-toolchain }})
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
      with:
        toolchain: ${{ matrix.rust-toolchain }}
        components: ${{ matrix.rust-components }}
        target: ${{ matrix.rust-extra-target }}
        cache: false

    - name: Install Zig
      if: ${{ matrix.job == 'zigbuild' }}
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.15.2

    - name: Cache Rust files
      continue-on-error: true # https://github.com/actions/cache/issues/1754
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ${{ matrix.rust-toolchain == 'stable' && 'target/**/*.rlib' || '' }}
        key: ${{ env.CACHE_KEY }}-${{ runner.os }}-cargo-${{ matrix.rust-toolchain }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ env.CACHE_KEY }}-${{ runner.os }}-cargo-${{ matrix.rust-toolchain }}-
     
    - name: Run ${{ matrix.job }}
      shell: bash
      env:
        TOOLCHAIN: ${{ matrix.rust-toolchain }}
        TARGET: ${{ matrix.target }}
        CLIPPY_LINTS: >-
          -D clippy::all
          -D deprecated-safe
          -D future-incompatible
          -D keyword-idents
          -D let-underscore
          -D nonstandard-style
          -D refining-impl-trait
          -D rust-2018-compatibility
          -D rust-2018-idioms
          -D rust-2021-compatibility
          -D rust-2024-compatibility
          -D unused
          -D unsafe_code
          -D unreachable-pub
          -D missing-docs
      run: ".github/jobs/${{ matrix.job }}.sh"

  success:
    runs-on: ubuntu-slim
    needs: build
    if: always()
    steps:
      - name: Report success or fail the workflow
        run: |
          echo "build matrix result: ${BUILD_RESULT}"
          if [ "${BUILD_RESULT}" != success ]; then
            echo "::error::Matrix job failed or did not succeed (result=${BUILD_RESULT})."
            exit 1
          fi
          echo "Success"
        env:
          BUILD_RESULT: ${{ needs.build.result }}

  # Tier-*BSD smoke tests (QEMU); see https://github.com/vmactions

  vmactions-freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD / test (stable)
    steps:
      - uses: actions/checkout@v6
      # macrotest needs `cargo expand`. Cache `CARGO_HOME` under the workspace (registry/git/bin)
      # so vmactions copyback + actions/cache reuse downloads and the installed `cargo-expand`.
      # `cargo clean` after tests drops `target/` so copyback stays small.
      - uses: actions/cache@v5
        with:
          path: .cache/ci/vmactions/freebsd
          key: vmactions-freebsd-14.4-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            vmactions-freebsd-14.4-
      # Build must run in the same vmactions step as host→VM sync: copyback only runs when this
      # action finishes. A later `shell: freebsd` step updates the VM only — the runner workspace
      # never gets the new binary, so actions/cache would save an empty/stale path.
      - name: Build and test
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          run: |
            set -xe
            # Only install rust if missing. Do not use `pkg install -U`: fresh images have no
            # repo catalog yet and fail with "Repository FreeBSD cannot be opened. pkg update required".
            if ! command -v cargo >/dev/null 2>&1; then
              pkg install -y rust
            fi
            export CARGO_HOME="${GITHUB_WORKSPACE}/.cache/ci/vmactions/freebsd/cargo-home"
            mkdir -p "${CARGO_HOME}/bin"
            export PATH="${CARGO_HOME}/bin:${PATH}"
            if [ ! -x "${CARGO_HOME}/bin/cargo-expand" ]; then
              cargo install cargo-expand --locked
            fi
            cargo build
            cargo test
            cargo clean

  vmactions-openbsd:
    runs-on: ubuntu-latest
    name: OpenBSD / test (stable)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .cache/ci/vmactions/openbsd
          key: vmactions-openbsd-7.8-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            vmactions-openbsd-7.8-
      - name: Build and test
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.8"
          usesh: true
          run: |
            set -xe
            if ! command -v cargo >/dev/null 2>&1; then
              pkg_add rust
            fi
            export CARGO_HOME="${GITHUB_WORKSPACE}/.cache/ci/vmactions/openbsd/cargo-home"
            mkdir -p "${CARGO_HOME}/bin"
            export PATH="${CARGO_HOME}/bin:${PATH}"
            if [ ! -x "${CARGO_HOME}/bin/cargo-expand" ]; then
              cargo install cargo-expand --locked
            fi
            cargo build
            cargo test
            cargo clean

  vmactions-netbsd:
    runs-on: ubuntu-latest
    # Full `cargo test` needs `cargo-expand`; installing it pulls deps (e.g. mio) that fail on NetBSD kqueue (udata typing).
    # Smoke-test examples only — same as DragonFly vmactions job.
    name: NetBSD / examples (stable)
    steps:
      - uses: actions/checkout@v6
      - name: Start VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          usesh: true
      - name: Run crate examples
        shell: netbsd {0}
        run: |
          set -xe
          export PATH="/usr/pkg/sbin:/usr/pkg/bin:/usr/sbin:/usr/bin:${PATH}"
          if [ -x /usr/pkg/bin/pkgin ]; then
            /usr/pkg/bin/pkgin update
            /usr/pkg/bin/pkgin -y install rust
          else
            export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/amd64/10.1/All"
            /usr/sbin/pkg_add rust
          fi
          cargo build --examples -p ctor -p dtor -p link-section
          for example in ctor-basic ctor-example ctor-advanced ctor-priority; do
            cargo run -p ctor --example "$example"
          done
          cargo run -p dtor --example dtor-example
          cargo run -p link-section --example link-section-example

  vmactions-dragonflybsd:
    runs-on: ubuntu-latest
    # Packaged Rust is often behind crates.io; full `cargo test` needs `cargo-expand` (rustc 1.88+ as of 2025).
    # Smoke-test published examples only (same spirit as zigbuild.sh).
    name: DragonFly BSD / examples (stable)
    steps:
      - uses: actions/checkout@v6
      - name: Start VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: "6.4.2"
          usesh: true
      - name: Run crate examples
        shell: dragonflybsd {0}
        run: |
          set -xe
          pkg install -y rust
          cargo build --examples -p ctor -p dtor -p link-section
          for example in ctor-basic ctor-example ctor-advanced ctor-priority; do
            cargo run -p ctor --example "$example"
          done
          cargo run -p dtor --example dtor-example
          cargo run -p link-section --example link-section-example
