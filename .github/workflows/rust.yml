name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        uses: "mmastrac/mmm-matrix@v1"
        with:
          input: |
            project: [ctor]
            needs:
              $match:
                "this.job == 'wasm'": "wasmtime-cli"
                "this.job == 'macrotest'": "cargo-expand"
                "this.job == 'zigbuild'": "cargo-zigbuild"
            rust-toolchain:
              $match:
                # i686 host toolchain
                "this.label == 'linux-x86'": stable-i686-unknown-linux-gnu
                "this.job == 'miri'": nightly
                "this.job == 'lint'": [stable, nightly]
                "this.job == 'test-used-linker'": nightly
                "this.job == 'build'": [stable, beta, nightly]
                "this.job == 'build-minimal' && this.label == 'windows'": ["1.88"]
                "this.job == 'build-minimal'": ["1.85", "1.88"]
                "this.job == 'build-ctor-minimal'": ["1.65"]
                "this.job == 'wasm'": [stable, "1.85"]
                "this.job == 'uefi'": stable
                "true": "stable"
            rust-extra-target:
              $match:
                "this.job == 'wasm'": "wasm32-unknown-unknown,wasm32-wasip1,wasm32-wasip2"
                "this.job == 'uefi'": "x86_64-unknown-uefi"
                "this.label == 'linux-musl'": "x86_64-unknown-linux-musl"
            sandbox:
              $match:
                "this.label == 'bsan'": bsan
                "this.label == 'freebsd'": freebsd
                "this.label == 'openbsd'": openbsd
                "this.label == 'netbsd'": netbsd
                "this.label == 'dragonfly'": dragonfly
            sandbox-release:
              $match:
                "this.label == 'freebsd'": "14.4"
                "this.label == 'openbsd'": "7.8"
                "this.label == 'netbsd'": "10.1"
                "this.label == 'dragonfly'": "6.4.2"
            timeout:
              $match:
                "this.job == 'crok' && this.label == 'bsan'": 60
                "this.job == 'crok'": 45
                "true": 360
            rust-components:
              $match:
                "this.job == 'miri'": "miri,rust-src"
                "this.job == 'lint'": "clippy,rustfmt"
                "this.job == 'test-used-linker'": rust-src
            label:
              linux:
                os:
                  ubuntu-latest:
                    job: [test, macrotest, test-used-linker, miri, wasm, uefi, build, build-minimal, build-ctor-minimal]
                    target: x86_64-unknown-linux-gnu
                  ubuntu-slim:
                    job: [lint, sanitize]
                    target: x86_64-unknown-linux-gnu
              linux-musl:
                os: ubuntu-latest
                job: [build, lint, test]
                target: x86_64-unknown-linux-musl
              linux-x86:
                os: ubuntu-latest
                job: test
                target: i686-unknown-linux-gnu
              macos:
                os: macOS-latest
                job: [lint, test, macrotest, test-used-linker, miri, zigbuild, sanitize, build-minimal]
                target: aarch64-apple-darwin
              windows:
                os: windows-latest
                job: [lint, test, macrotest, miri, build-minimal]
                target: x86_64-pc-windows-msvc
              bsan:
                os: ubuntu-latest
                job: [crok]
                target: x86_64-unknown-linux-gnu
              freebsd:
                os: ubuntu-latest
                job: [crok]
                target: x86_64-unknown-freebsd
              openbsd:
                os: ubuntu-latest
                job: [crok]
                target: x86_64-unknown-openbsd
              netbsd:
                os: ubuntu-latest
                job: [crok]
                target: x86_64-unknown-netbsd
              dragonfly:
                os: ubuntu-latest
                job: [crok]
                target: x86_64-unknown-dragonfly
          config: |
            github: ${{ toJSON(github) }}

  build:
    name: ${{ matrix.label }} / ${{ matrix.job }} (${{ matrix.rust-toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    env:
      CACHE_KEY: 2

    steps:
    - uses: actions/checkout@v6

    - name: Install required Rust tools
      uses: taiki-e/install-action@v2
      if: ${{ matrix.needs }}
      with:
        tool: ${{ matrix.needs }}
  
    # Build crok with preinstalled stable, before the toolchain override
    - name: Install crok
      if: ${{ contains(matrix.job, 'minimal') || matrix.job == 'crok' }}
      uses: taiki-e/cache-cargo-install-action@v2
      with:
        tool: crok@0.9.0

    - name: Install 32-bit host libraries
      if: ${{ contains(matrix.target, 'i686') }}
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib lib32z1 lib32stdc++6

    - name: Install QEMU and OVMF firmware
      if: ${{ matrix.job == 'uefi' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 ovmf

    # rustup refuses non-host toolchains without --force-non-host
    - name: Install Rust toolchain (${{ matrix.rust-toolchain }}, non-host)
      if: ${{ contains(matrix.rust-toolchain, 'i686') }}
      shell: bash
      run: |
        rustup toolchain install "${{ matrix.rust-toolchain }}" --force-non-host --profile minimal --no-self-update
        rustup override set "${{ matrix.rust-toolchain }}"

    - name: Install Rust toolchain (${{ matrix.rust-toolchain }})
      if: ${{ !contains(matrix.rust-toolchain, 'i686') }}
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
      with:
        toolchain: ${{ matrix.rust-toolchain }}
        components: ${{ matrix.rust-components }}
        target: ${{ matrix.rust-extra-target }}
        cache: false

    - name: Install Zig
      if: ${{ matrix.job == 'zigbuild' }}
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.15.2

    - name: Start sandbox
      id: sandbox
      if: ${{ matrix.sandbox }}
      run: .github/jobs/sandbox.sh start ${{ matrix.sandbox }}

    # The sandbox keeps its whole cargo home under the workspace.
    - name: Cache sandbox
      if: ${{ matrix.sandbox }}
      continue-on-error: true # https://github.com/actions/cache/issues/1754
      uses: actions/cache@v5
      with:
        path: .cache/ci/sandbox/${{ matrix.sandbox }}
        key: sandbox-${{ matrix.sandbox }}-${{ matrix.sandbox-release }}${{ steps.sandbox.outputs.toolchain }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sandbox-${{ matrix.sandbox }}-${{ matrix.sandbox-release }}${{ steps.sandbox.outputs.toolchain }}-

    - name: Provision FreeBSD VM
      if: ${{ matrix.sandbox == 'freebsd' }}
      uses: vmactions/freebsd-vm@v1
      with:
        release: ${{ matrix.sandbox-release }}
        usesh: true
        run: sh .github/jobs/vmactions.sh

    - name: Provision OpenBSD VM
      if: ${{ matrix.sandbox == 'openbsd' }}
      uses: vmactions/openbsd-vm@v1
      with:
        release: ${{ matrix.sandbox-release }}
        usesh: true
        run: sh .github/jobs/vmactions.sh

    - name: Provision NetBSD VM
      if: ${{ matrix.sandbox == 'netbsd' }}
      uses: vmactions/netbsd-vm@v1
      with:
        release: ${{ matrix.sandbox-release }}
        usesh: true
        run: sh .github/jobs/vmactions.sh

    - name: Provision DragonFly BSD VM
      if: ${{ matrix.sandbox == 'dragonfly' }}
      uses: vmactions/dragonflybsd-vm@v1
      with:
        release: ${{ matrix.sandbox-release }}
        usesh: true
        run: sh .github/jobs/vmactions.sh

    - name: Provision sandbox
      if: ${{ matrix.sandbox }}
      run: .github/jobs/sandbox.sh provision ${{ matrix.sandbox }}

    - name: Cache Rust files
      if: ${{ !matrix.sandbox }}
      continue-on-error: true # https://github.com/actions/cache/issues/1754
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ${{ matrix.rust-toolchain == 'stable' && 'target/**/*.rlib' || '' }}
        key: ${{ env.CACHE_KEY }}-${{ runner.os }}-cargo-${{ matrix.rust-toolchain }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ env.CACHE_KEY }}-${{ runner.os }}-cargo-${{ matrix.rust-toolchain }}-
     
    - name: Run ${{ matrix.job }}
      shell: bash
      env:
        TOOLCHAIN: ${{ matrix.rust-toolchain }}
        TARGET: ${{ matrix.target }}
        SANDBOX: ${{ matrix.sandbox }}
        CLIPPY_LINTS: >-
          -D clippy::all
          -D deprecated-safe
          -D future-incompatible
          -D keyword-idents
          -D let-underscore
          -D nonstandard-style
          -D refining-impl-trait
          -D rust-2018-compatibility
          -D rust-2018-idioms
          -D rust-2021-compatibility
          -D rust-2024-compatibility
          -D unused
          -D unsafe_code
          -D unreachable-pub
          -D missing-docs
      run: ".github/jobs/${{ matrix.job }}.sh"

  success:
    runs-on: ubuntu-slim
    needs: [build]
    if: always()
    steps:
      - name: Report success or fail the workflow
        run: |
          echo "build matrix result: ${BUILD_RESULT}"
          if [ "${BUILD_RESULT}" != success ]; then
            echo "::error::Matrix job failed or did not succeed (result=${BUILD_RESULT})."
            exit 1
          fi
          echo "Success"
        env:
          BUILD_RESULT: ${{ needs.build.result }}
