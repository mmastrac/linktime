name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-matrix:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        uses: "mmastrac/mmm-matrix@v1"
        with:
          input: |
            project: [ctor]
            needs:
              $match:
                "this.job == 'wasm'": "wasmtime-cli"
                "this.job == 'test'": "cargo-expand"
                "this.job == 'zigbuild'": "cargo-zigbuild"
            rust-toolchain:
              $match:
                # i686 host toolchain
                "this.label == 'linux-x86'": stable-i686-unknown-linux-gnu
                "this.job == 'miri'": nightly
                "this.job == 'lint'": [stable, nightly]
                "this.job == 'test-used-linker'": nightly
                "this.job == 'build'": [stable, beta, nightly]
                "this.job == 'build-minimal' && this.label == 'windows'": ["1.88"]
                "this.job == 'build-minimal'": ["1.85", "1.88"]
                "this.job == 'build-ctor-minimal'": ["1.65"]
                "this.job == 'wasm'": [stable, "1.85"]
                "true": "stable"
            rust-extra-target:
              $match:
                "this.job == 'wasm'": "wasm32-unknown-unknown,wasm32-wasip1,wasm32-wasip2"
                "this.label == 'linux-musl'": "x86_64-unknown-linux-musl"
            rust-components:
              $match:
                "this.job == 'miri'": "miri,rust-src"
                "this.job == 'lint'": "clippy,rustfmt"
                "this.job == 'test-used-linker'": rust-src
            label:
              linux:
                os:
                  ubuntu-latest:
                    job: [test, test-used-linker, miri, wasm, build, build-minimal, build-ctor-minimal]
                    target: x86_64-unknown-linux-gnu
                  ubuntu-slim:
                    job: [lint, sanitize]
                    target: x86_64-unknown-linux-gnu
              linux-musl:
                os: ubuntu-latest
                job: [build, lint, test]
                target: x86_64-unknown-linux-musl
              linux-x86:
                os: ubuntu-latest
                job: test
                target: i686-unknown-linux-gnu
              macos:
                os: macOS-latest
                job: [lint, test, test-used-linker, miri, zigbuild, sanitize, build-minimal]
                target: aarch64-apple-darwin
              windows:
                os: windows-latest
                job: [lint, test, miri, build-minimal]
                target: x86_64-pc-windows-msvc
          config: |
            github: ${{ toJSON(github) }}

  build:
    name: ${{ matrix.label }} / ${{ matrix.job }} (${{ matrix.rust-toolchain }})
    runs-on: ${{ matrix.os }}
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    env:
      CACHE_KEY: 2

    steps:
    - uses: actions/checkout@v6

    - name: Install required Rust tools
      uses: taiki-e/install-action@v2
      if: ${{ matrix.needs }}
      with:
        tool: ${{ matrix.needs }}
  
    # Build crok with preinstalled stable, before the toolchain override
    - name: Install crok
      if: ${{ contains(matrix.job, 'minimal') }}
      uses: taiki-e/cache-cargo-install-action@v2
      with:
        tool: crok@0.9.0

    - name: Install 32-bit host libraries
      if: ${{ contains(matrix.target, 'i686') }}
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib lib32z1 lib32stdc++6

    # rustup refuses non-host toolchains without --force-non-host
    - name: Install Rust toolchain (${{ matrix.rust-toolchain }}, non-host)
      if: ${{ contains(matrix.rust-toolchain, 'i686') }}
      shell: bash
      run: |
        rustup toolchain install "${{ matrix.rust-toolchain }}" --force-non-host --profile minimal --no-self-update
        rustup override set "${{ matrix.rust-toolchain }}"

    - name: Install Rust toolchain (${{ matrix.rust-toolchain }})
      if: ${{ !contains(matrix.rust-toolchain, 'i686') }}
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
      with:
        toolchain: ${{ matrix.rust-toolchain }}
        components: ${{ matrix.rust-components }}
        target: ${{ matrix.rust-extra-target }}
        cache: false

    - name: Install Zig
      if: ${{ matrix.job == 'zigbuild' }}
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.15.2

    - name: Cache Rust files
      continue-on-error: true # https://github.com/actions/cache/issues/1754
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ${{ matrix.rust-toolchain == 'stable' && 'target/**/*.rlib' || '' }}
        key: ${{ env.CACHE_KEY }}-${{ runner.os }}-cargo-${{ matrix.rust-toolchain }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ env.CACHE_KEY }}-${{ runner.os }}-cargo-${{ matrix.rust-toolchain }}-
     
    - name: Run ${{ matrix.job }}
      shell: bash
      env:
        TOOLCHAIN: ${{ matrix.rust-toolchain }}
        TARGET: ${{ matrix.target }}
        CLIPPY_LINTS: >-
          -D clippy::all
          -D deprecated-safe
          -D future-incompatible
          -D keyword-idents
          -D let-underscore
          -D nonstandard-style
          -D refining-impl-trait
          -D rust-2018-compatibility
          -D rust-2018-idioms
          -D rust-2021-compatibility
          -D rust-2024-compatibility
          -D unused
          -D unsafe_code
          -D unreachable-pub
          -D missing-docs
      run: ".github/jobs/${{ matrix.job }}.sh"

  success:
    runs-on: ubuntu-slim
    needs: build
    if: always()
    steps:
      - name: Report success or fail the workflow
        run: |
          echo "build matrix result: ${BUILD_RESULT}"
          if [ "${BUILD_RESULT}" != success ]; then
            echo "::error::Matrix job failed or did not succeed (result=${BUILD_RESULT})."
            exit 1
          fi
          echo "Success"
        env:
          BUILD_RESULT: ${{ needs.build.result }}

  # Tier-*BSD tests (QEMU); see https://github.com/vmactions
  #
  # vmactions.sh provisions the VM (copyback feeds the cache). The crok suite
  # runs host-side, driving commands into the VM via vm-run.sh. FreeBSD/OpenBSD
  # also run in-VM doctests. macrotest/compile-fail need cargo-expand, tier-1 only.

  vmactions-freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD / test (stable)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .cache/ci/vmactions/freebsd
          key: vmactions-freebsd-14.4-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            vmactions-freebsd-14.4-
      - name: Install crok
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: crok@0.9.0
      - name: Provision VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          run: sh .github/jobs/vmactions.sh provision
      - name: Run crok suite
        run: bash .github/jobs/vm-crok.sh freebsd freebsd
      - name: Doc tests
        shell: freebsd {0}
        run: sh .github/jobs/vmactions.sh doctest

  vmactions-openbsd:
    runs-on: ubuntu-latest
    name: OpenBSD / test (stable)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .cache/ci/vmactions/openbsd
          key: vmactions-openbsd-7.8-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            vmactions-openbsd-7.8-
      - name: Install crok
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: crok@0.9.0
      - name: Provision VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.8"
          usesh: true
          run: sh .github/jobs/vmactions.sh provision
      - name: Run crok suite
        run: bash .github/jobs/vm-crok.sh openbsd openbsd
      - name: Doc tests
        shell: openbsd {0}
        run: sh .github/jobs/vmactions.sh doctest

  vmactions-netbsd:
    runs-on: ubuntu-latest
    name: NetBSD / test (stable)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .cache/ci/vmactions/netbsd
          key: vmactions-netbsd-10.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            vmactions-netbsd-10.1-
      - name: Install crok
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: crok@0.9.0
      - name: Provision VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          usesh: true
          run: sh .github/jobs/vmactions.sh provision
      - name: Run crok suite
        run: bash .github/jobs/vm-crok.sh netbsd netbsd

  vmactions-dragonflybsd:
    runs-on: ubuntu-latest
    name: DragonFly BSD / test (stable)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: .cache/ci/vmactions/dragonfly
          key: vmactions-dragonfly-6.4.2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            vmactions-dragonfly-6.4.2-
      - name: Install crok
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: crok@0.9.0
      - name: Provision VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: "6.4.2"
          usesh: true
          run: sh .github/jobs/vmactions.sh provision
      - name: Run crok suite
        run: bash .github/jobs/vm-crok.sh dragonflybsd dragonfly
