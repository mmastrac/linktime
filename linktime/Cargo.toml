[package]
name = "linktime"
version = "0.0.1"
authors.workspace = true
edition = "2021"
description = "Link-time tricks for Rust"
license.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["no-std"]
rust-version = "1.60"

[features]
default = ["std", "proc_macro"]

std = []

# Enable the proc_macro
proc_macro = ["dep:linktime-proc-macro"]

# For nightly users, used(linker) may be a better choice
used_linker = []

[dependencies]
linktime-proc-macro = { workspace = true, optional = true }

[dev-dependencies]
libc-print = "0.1"
macrotest = "1"
trybuild = "1"
walkdir = "2"
tempfile = "3"
