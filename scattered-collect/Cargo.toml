[package]
name = "scattered-collect"
version = "0.2.1"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Link-time collections for Rust (distributed slices, registries)"
categories = ["data-structures", "development-tools::build-utils", "no-std"]
rust-version = "1.85"

[dependencies]
linktime = { workspace = true , features = ["std", "ctor", "link-section", "dtor"] }
link-section = { workspace = true, features = ["proc_macro"] }
ctor = { workspace = true, features = ["proc_macro", "priority", "std"] }
scattered-collect-proc-macro.workspace = true
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }
wide = "1.3"

[[example]]
name = "slice"
path = "examples/slice.rs"

[[example]]
name = "sorted_slice"
path = "examples/sorted_slice.rs"

[[example]]
name = "referenced_slice"
path = "examples/referenced_slice.rs"

[[example]]
name = "sorted_referenced_slice"
path = "examples/sorted_referenced_slice.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(linktime_used_linker)',
] }
