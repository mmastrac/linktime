[package]
name = "scattered-collect"
version = "0.20.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Link-time collections for Rust (distributed slices, registries)"
categories = ["data-structures", "development-tools::build-utils", "no-std"]
rust-version = "1.85"

[features]
__internal = []

[dependencies]
linktime = { workspace = true , features = ["std", "ctor", "link-section", "dtor"] }
link-section = { workspace = true, features = ["proc_macro"] }
ctor = { workspace = true, features = ["proc_macro", "priority", "std"] }
linktime-proc-macro = { workspace = true, features = ["scattered_collect"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }
wide = "1.3"

[dev-dependencies]
divan = "0.1.21"
scattered-collect = { path = ".", features = ["__internal"] }

[[example]]
name = "scattered-collect-iterable"
path = "examples/iterable.rs"

[[example]]
name = "scattered-collect-intern-strings"
path = "examples/intern_strings.rs"

[[example]]
name = "scattered-collect-map"
path = "examples/map.rs"

[[example]]
name = "scattered-collect-set"
path = "examples/set.rs"

[[example]]
name = "scattered-collect-slice"
path = "examples/slice.rs"

[[example]]
name = "scattered-collect-sorted-slice"
path = "examples/sorted_slice.rs"

[[example]]
name = "scattered-collect-referenced-slice"
path = "examples/referenced_slice.rs"

[[example]]
name = "scattered-collect-sorted-referenced-slice"
path = "examples/sorted_referenced_slice.rs"

[[bench]]
name = "map"
harness = false
path = "benches/map.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(linktime_used_linker)',
] }
