[package]
name = "ctor"
version = "0.12.0"
authors.workspace = true
edition = "2021"
description = "__attribute__((constructor)) for Rust"
license.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["no-std"]
rust-version = "1.60"

[features]
default = ["std", "proc_macro", "priority"]

std = []

# Enable support for the priority parameter
priority = ["dep:link-section"]

# Enable the proc_macro
proc_macro = ["dep:linktime-proc-macro"]

# For nightly users, used(linker) may be a better choice
used_linker = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(no_fail_on_missing_unsafe)'] }

[dependencies]
linktime-proc-macro = { workspace = true, optional = true, features = ["ctor"] }
link-section = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
libc-print = "0.1"
macrotest = "1"
trybuild = "1"
walkdir = "2"
tempfile = "3"
