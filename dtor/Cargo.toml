[package]
name = "dtor"
version = "1.0.0"
authors.workspace = true
edition = "2021"
description = "__attribute__((destructor)) for Rust"
license.workspace = true
repository.workspace = true
readme = "README.md"
categories = ["no-std"]
rust-version = "1.60"

exclude = ["tests"]

[features]
default = ["std", "proc_macro"]
std = []
proc_macro = ["dep:linktime-proc-macro"]

[dependencies]
linktime-proc-macro = { workspace = true, optional = true, features = ["dtor"] }

[dev-dependencies]
libc-print = "0.3"
macrotest = "1"
trybuild = "1"
walkdir = "2"
tempfile = "3"

[[example]]
name = "dtor-example"
path = "src/example.rs"

[lib]
name = "dtor"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(linktime_no_fail_on_missing_unsafe)',
    'cfg(linktime_used_linker)'
] }
