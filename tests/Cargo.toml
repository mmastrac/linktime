[package]
name = "tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
crok-lib = { version = "0.8.2", default-features = false, features = ["fancy-regex"] }

# Custom runner: discovers and runs every `.crok` file under this crate. See
# `test.rs`. `harness = false` lets us do our own discovery and name filtering.
[[test]]
name = "crok"
path = "test.rs"
harness = false
