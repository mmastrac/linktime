[package]
name = "tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]

[dependencies]
ctor = { path = "../../../ctor" }
dtor = { path = "../../../dtor" }
dlopen = "0.1.8"
libc-print = "0.5"
libc = { version = "0.2.96", default-features = false }

[[example]]
name = "dylib"
path = "src/dylib.rs"
crate-type = ["cdylib"]

[[example]]
name = "dylib_load"
path = "src/dylib_load.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(no_fail_on_missing_unsafe)',
    'cfg(linktime_used_linker)'
] }

[workspace]
