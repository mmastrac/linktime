[package]
name = "uefi-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
linktime = { path = "../../../linktime", default-features = false, features = [
    "proc_macro",
    "ctor",
    "dtor",
    "link-section",
] }

# UEFI has no unwinder, so a panic aborts the boot.
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"

[workspace]
